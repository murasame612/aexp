<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aexp - Agent Experiment Control Plane</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
        .status-running { color: #22c55e; }
        .status-succeeded { color: #3b82f6; }
        .status-failed { color: #ef4444; }
        .status-cancelled { color: #6b7280; }
        .status-idle { color: #22c55e; }
        .status-busy { color: #f59e0b; }
        .status-error, .status-unreachable { color: #ef4444; }
        .resource-bar { background: #1e293b; border-radius: 4px; height: 20px; overflow: hidden; }
        .resource-bar-fill { height: 100%; display: flex; align-items: center; padding: 0 8px; font-size: 11px; min-width: 40px; }
        .resource-bar-fill.green { background: #22c55e; }
        .resource-bar-fill.yellow { background: #f59e0b; }
        .resource-bar-fill.red { background: #ef4444; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; }
        .log-pane { background: #0c1222; border: 1px solid #334155; border-radius: 4px; font-family: 'Menlo', 'Monaco', monospace; font-size: 12px; max-height: 400px; overflow-y: auto; padding: 8px; }
        .tab { padding: 8px 16px; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab.active { border-color: #3b82f6; color: #3b82f6; }
        .tab:hover { color: #93c5fd; }
        a { color: #60a5fa; }
        a:hover { color: #93c5fd; }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-6">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-2xl font-bold">aexp</h1>
            <div class="flex items-center gap-3">
                <button onclick="loadData()" class="px-3 py-1 bg-slate-700 rounded hover:bg-slate-600">Refresh</button>
                <span id="status-indicator" class="text-sm text-slate-400">Loading...</span>
                <div id="token-bar" class="flex items-center gap-2">
                    <input id="token-input" type="password" placeholder="API Token"
                        class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-sm w-48 placeholder-slate-500 focus:outline-none focus:border-blue-500"
                        onkeydown="if(event.key==='Enter')saveToken()">
                    <button onclick="saveToken()" class="px-2 py-1 bg-blue-600 rounded text-sm hover:bg-blue-500">Set</button>
                    <button id="token-clear" onclick="clearToken()" class="px-2 py-1 bg-slate-700 rounded text-sm hover:bg-slate-600 hidden">Clear</button>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex gap-1 mb-6 border-b border-slate-700">
            <div class="tab active" onclick="showTab('dashboard')">Dashboard</div>
            <div class="tab" onclick="showTab('resources')">Resources</div>
            <div class="tab" onclick="showTab('runs')">Runs</div>
        </div>

        <!-- Dashboard Tab -->
        <div id="tab-dashboard">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
                <div class="card">
                    <div class="text-sm text-slate-400">Resources</div>
                    <div class="text-3xl font-bold" id="stat-resources">-</div>
                </div>
                <div class="card">
                    <div class="text-sm text-slate-400">Active Runs</div>
                    <div class="text-3xl font-bold" id="stat-active-runs">-</div>
                </div>
                <div class="card">
                    <div class="text-sm text-slate-400">Total Runs</div>
                    <div class="text-3xl font-bold" id="stat-total-runs">-</div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div>
                    <h2 class="text-lg font-semibold mb-3">Resources</h2>
                    <div id="resource-cards" class="space-y-3"></div>
                </div>
                <div>
                    <h2 class="text-lg font-semibold mb-3">Active Runs</h2>
                    <div id="active-run-cards" class="space-y-3"></div>
                </div>
            </div>
        </div>

        <!-- Resources Tab -->
        <div id="tab-resources" class="hidden">
            <div id="resources-table-container"></div>
        </div>

        <!-- Runs Tab -->
        <div id="tab-runs" class="hidden">
            <div class="flex gap-2 mb-4">
                <select id="run-filter-status" onchange="loadRuns()" class="bg-slate-700 rounded px-2 py-1 text-sm">
                    <option value="">All Status</option>
                    <option value="running">Running</option>
                    <option value="succeeded">Succeeded</option>
                    <option value="failed">Failed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div id="runs-table-container"></div>
        </div>

        <!-- Run Detail Modal -->
        <div id="run-detail" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
            <div class="bg-slate-800 rounded-lg w-full max-w-4xl max-h-[90vh] overflow-y-auto p-6">
                <div class="flex justify-between items-start mb-4">
                    <h2 class="text-lg font-semibold" id="detail-title">Run Detail</h2>
                    <button onclick="closeDetail()" class="text-slate-400 hover:text-white">&times;</button>
                </div>
                <div id="detail-content"></div>
            </div>
        </div>
    </div>

    <script>
        const API = '/api/v1';
        let ws = null;

        // --- Token management ---
        function getToken() {
            return localStorage.getItem('aexp_token') || '';
        }

        function saveToken() {
            const input = document.getElementById('token-input');
            const token = input.value.trim();
            if (!token) return;
            localStorage.setItem('aexp_token', token);
            input.value = '';
            updateTokenUI();
            loadData();
        }

        function clearToken() {
            localStorage.removeItem('aexp_token');
            updateTokenUI();
            loadData();
        }

        function updateTokenUI() {
            const has = !!getToken();
            document.getElementById('token-clear').classList.toggle('hidden', !has);
            document.getElementById('token-input').classList.toggle('border-red-500', false);
        }

        function authHeaders() {
            const token = getToken();
            return token ? { 'Authorization': 'Bearer ' + token } : {};
        }

        async function fetchJSON(url) {
            try {
                const res = await fetch(API + url, { headers: authHeaders() });
                if (res.status === 401) {
                    document.getElementById('token-input').classList.add('border-red-500');
                    document.getElementById('token-input').focus();
                    return null;
                }
                if (!res.ok) return null;
                const data = await res.json();
                return data;
            } catch {
                return null;
            }
        }

        function asArray(v) {
            return Array.isArray(v) ? v : [];
        }

        function asObject(v) {
            return v && typeof v === 'object' && !Array.isArray(v) ? v : {};
        }

        function asText(v) {
            return v === null || v === undefined ? '' : String(v);
        }

        function logLines(logs) {
            return asArray(asObject(logs).lines);
        }

        async function loadData() {
            const [stats, resources, runs] = await Promise.all([
                fetchJSON('/stats'),
                fetchJSON('/resources'),
                fetchJSON('/runs?limit=20')
            ]);

            const s = asObject(stats);
            document.getElementById('stat-resources').textContent = s.total_resources || 0;
            document.getElementById('stat-active-runs').textContent = s.active_runs || 0;
            document.getElementById('stat-total-runs').textContent = s.total_runs || 0;

            const resArr = asArray(resources);
            const runArr = asArray(runs);
            renderResourceCards(resArr);
            renderActiveRuns(runArr.filter(r => asObject(r).status === 'running'));
            renderResourcesTable(resArr);
            renderRunsTable(runArr);

            const hasToken = !!getToken();
            const got401 = (stats === null && resources === null && runs === null);
            if (got401 && !hasToken) {
                document.getElementById('status-indicator').textContent = 'Set API token above';
            } else if (got401) {
                document.getElementById('status-indicator').textContent = 'Invalid token';
            } else {
                document.getElementById('status-indicator').textContent = 'Updated: ' + new Date().toLocaleTimeString();
            }
        }

        function renderResourceCards(resources) {
            const container = document.getElementById('resource-cards');
            if (!resources.length) {
                container.innerHTML = '<div class="text-slate-400">No resources registered</div>';
                return;
            }
            container.innerHTML = resources.map(r => {
                r = asObject(r);
                const snap = r.latest_snapshot || {};
                const gpus = tryParseJSON(snap.gpu_json, []);
                return `
                    <div class="card">
                        <div class="flex justify-between items-start mb-2">
                            <span class="font-medium">${r.name}</span>
                            <span class="text-sm status-${r.status}">${r.status}</span>
                        </div>
                        <div class="text-xs text-slate-400 mb-2">${r.host} | ${r.type} | ${r.conda_env || '-'}</div>
                        <div class="space-y-1">
                            <div class="flex items-center gap-2 text-xs">
                                <span class="w-10">CPU</span>
                                ${progressBar(snap.cpu_percent || 0)}
                                <span class="w-12 text-right">${(snap.cpu_percent || 0).toFixed(1)}%</span>
                            </div>
                            <div class="flex items-center gap-2 text-xs">
                                <span class="w-10">MEM</span>
                                ${progressBar(snap.mem_total_mb ? (snap.mem_used_mb/snap.mem_total_mb*100) : 0)}
                                <span class="w-20 text-right">${formatMB(snap.mem_used_mb)} / ${formatMB(snap.mem_total_mb)}</span>
                            </div>
                            ${asArray(gpus).map(g => {
                                g = asObject(g);
                                return `
                                <div class="flex items-center gap-2 text-xs">
                                    <span class="w-10">GPU${g.index}</span>
                                    ${progressBar(g.util)}
                                    <span class="w-20 text-right">${formatMB(g.mem_used)} / ${formatMB(g.mem_total)}</span>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>`;
            }).join('');
        }

        function renderActiveRuns(runs) {
            const container = document.getElementById('active-run-cards');
            if (!runs.length) {
                container.innerHTML = '<div class="text-slate-400">No active runs</div>';
                return;
            }
            container.innerHTML = runs.map(r => {
                r = asObject(r);
                const command = asText(r.command);
                return `
                    <div class="card cursor-pointer hover:border-slate-500" onclick="showRunDetail('${r.id}')">
                        <div class="flex justify-between items-start mb-1">
                            <span class="font-medium text-sm">${r.name || r.id}</span>
                            <span class="text-xs status-${r.status}">${r.status}</span>
                        </div>
                        <div class="text-xs text-slate-400">${r.resource_id || '-'} | ${command.substring(0, 60)}${command.length > 60 ? '...' : ''}</div>
                    </div>`;
            }).join('');
        }

        function renderResourcesTable(resources) {
            const container = document.getElementById('resources-table-container');
            if (!resources.length) {
                container.innerHTML = '<div class="text-slate-400">No resources</div>';
                return;
            }
            container.innerHTML = `
                <table class="w-full text-sm">
                    <thead><tr class="text-left text-slate-400 border-b border-slate-700">
                        <th class="py-2">Name</th><th>Type</th><th>Host</th><th>GPU</th><th>Status</th><th>CPU</th><th>MEM</th>
                    </tr></thead>
                    <tbody>${resources.map(r => {
                        r = asObject(r);
                        const snap = asObject(r.latest_snapshot);
                        return `<tr class="border-b border-slate-800 hover:bg-slate-800">
                            <td class="py-2"><a href="#" onclick="showRunDetail; return false;">${r.name}</a></td>
                            <td>${r.type}</td><td>${r.host}</td><td>${r.gpu_indices || '-'}</td>
                            <td class="status-${r.status}">${r.status}</td>
                            <td>${(snap.cpu_percent||0).toFixed(1)}%</td>
                            <td>${formatMB(snap.mem_used_mb)} / ${formatMB(snap.mem_total_mb)}</td>
                        </tr>`;
                    }).join('')}</tbody>
                </table>`;
        }

        function renderRunsTable(runs) {
            const container = document.getElementById('runs-table-container');
            if (!runs.length) {
                container.innerHTML = '<div class="text-slate-400">No runs</div>';
                return;
            }
            container.innerHTML = `
                <table class="w-full text-sm">
                    <thead><tr class="text-left text-slate-400 border-b border-slate-700">
                        <th class="py-2">ID</th><th>Name</th><th>Resource</th><th>Status</th><th>Command</th>
                    </tr></thead>
                    <tbody>${runs.map(r => {
                        r = asObject(r);
                        return `
                            <tr class="border-b border-slate-800 hover:bg-slate-800 cursor-pointer" onclick="showRunDetail('${r.id}')">
                                <td class="py-2 font-mono text-xs">${r.id || '-'}</td>
                                <td>${r.name || '-'}</td>
                                <td>${r.resource_id || '-'}</td>
                                <td class="status-${r.status}">${r.status || '-'}</td>
                                <td class="truncate max-w-xs">${asText(r.command).substring(0, 80)}</td>
                            </tr>`;
                    }).join('')}</tbody>
                </table>`;
        }

        async function showRunDetail(id) {
            const run = await fetchJSON(`/runs/${id}`);
            if (!run) return;
            const logs = asObject(await fetchJSON(`/runs/${id}/logs?source=stdout&limit=100`));
            const errLogs = asObject(await fetchJSON(`/runs/${id}/logs?source=stderr&limit=50`));
            const stdoutLines = logLines(logs);
            const stderrLines = logLines(errLogs);

            document.getElementById('detail-title').textContent = `Run: ${run.name || run.id}`;
            document.getElementById('detail-content').innerHTML = `
                <div class="grid grid-cols-2 gap-4 mb-4 text-sm">
                    <div><span class="text-slate-400">ID:</span> <span class="font-mono">${run.id}</span></div>
                    <div><span class="text-slate-400">Status:</span> <span class="status-${run.status} font-medium">${run.status}</span></div>
                    <div><span class="text-slate-400">Resource:</span> ${run.resource_id}</div>
                    <div><span class="text-slate-400">Conda:</span> ${run.conda_env || '-'}</div>
                    <div class="col-span-2"><span class="text-slate-400">Command:</span> <code class="text-xs bg-slate-900 px-2 py-1 rounded">${run.command}</code></div>
                    <div><span class="text-slate-400">CWD:</span> ${run.cwd || '-'}</div>
                    <div><span class="text-slate-400">tmux:</span> ${run.tmux_session || '-'}</div>
                </div>
                <div class="mb-4">
                    <h3 class="text-sm font-medium mb-2">stdout (${logs.total_lines || 0} lines)</h3>
                    <div class="log-pane" id="log-pane">${stdoutLines.map(l => asText(asObject(l).content)).join('\n')}</div>
                </div>
                ${stderrLines.length > 0 ? `
                <div class="mb-4">
                    <h3 class="text-sm font-medium mb-2">stderr</h3>
                    <div class="log-pane text-red-400">${stderrLines.map(l => asText(asObject(l).content)).join('\n')}</div>
                </div>` : ''}
                ${run.status === 'running' ? `<button onclick="cancelRun('${run.id}')" class="px-4 py-2 bg-red-600 rounded hover:bg-red-500">Cancel Run</button>` : ''}
            `;
            document.getElementById('run-detail').classList.remove('hidden');

            // Auto-scroll log pane
            const logPane = document.getElementById('log-pane');
            if (logPane) logPane.scrollTop = logPane.scrollHeight;

            // Connect WebSocket for live logs
            if (run.status === 'running') {
                connectWS(id);
            }
        }

        function closeDetail() {
            document.getElementById('run-detail').classList.add('hidden');
            if (ws) { ws.close(); ws = null; }
        }

        function connectWS(runId) {
            if (ws) ws.close();
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws/runs/${runId}/logs`);
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'log.line') {
                    const logPane = document.getElementById('log-pane');
                    if (logPane) {
                        logPane.textContent += '\n' + msg.content;
                        logPane.scrollTop = logPane.scrollHeight;
                    }
                }
            };
        }

        async function cancelRun(id) {
            if (!confirm('Cancel this run?')) return;
            await fetch(`${API}/runs/${id}/cancel`, { method: 'POST', headers: authHeaders() });
            loadData();
            closeDetail();
        }

        function showTab(name) {
            document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + name).classList.remove('hidden');
            event.target.classList.add('active');
        }

        function progressBar(pct) {
            pct = Math.min(100, Math.max(0, pct || 0));
            const color = pct < 60 ? 'green' : pct < 80 ? 'yellow' : 'red';
            return `<div class="resource-bar flex-1"><div class="resource-bar-fill ${color}" style="width:${pct}%"></div></div>`;
        }

        function formatMB(mb) {
            if (!mb) return '-';
            if (mb >= 1024) return (mb/1024).toFixed(1) + 'G';
            return Math.round(mb) + 'M';
        }

        function tryParseJSON(str, fallback) {
            try { return JSON.parse(str || 'null') || fallback; } catch { return fallback; }
        }

        async function loadRuns() {
            const status = document.getElementById('run-filter-status').value;
            const runs = await fetchJSON(`/runs?limit=50&status=${status}`);
            renderRunsTable(asArray(runs));
        }

        // Initial load
        updateTokenUI();
        loadData();
        setInterval(loadData, 5000);
    </script>
</body>
</html>
